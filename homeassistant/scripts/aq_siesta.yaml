# base_pct-Fallback ist auf 90 vereinheitlicht (= initial-Wert von
# input_number.aq_base_day_pct im Package). Greift nur, falls der Helper
# ausnahmsweise 'unknown' sein sollte.

alias: AQ Siesta
mode: restart
sequence:
  - condition: state
    entity_id: input_boolean.aq_siesta_enable
    state: 'on'
  - variables:
      siesta_pct: '{{ states(''input_number.aq_siesta_pct'')|int(45) }}'
      siesta_min: '{{ states(''input_number.aq_siesta_minutes'')|int(60) }}'
      base_pct: '{{ states(''input_number.aq_base_day_pct'')|int(90) }}'
  - service: light.turn_on
    target:
      entity_id:
        - light.dimmer_sera_ch1
        - light.dimmer_sera_ch2
    data:
      brightness_pct: '{{ siesta_pct }}'
      transition: 30
  - delay:
      minutes: '{{ siesta_min }}'
  - service: light.turn_on
    target:
      entity_id:
        - light.dimmer_sera_ch1
        - light.dimmer_sera_ch2
    data:
      brightness_pct: '{{ base_pct }}'
      transition: 30