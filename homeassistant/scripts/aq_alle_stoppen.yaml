# NOTE: references script.aq_weather_link_update, which now lives under
# homeassistant/experimental/ and is NOT included via the regular
# !include_dir_named scripts/. That entity won't exist — script.turn_off
# on it is harmless (just a log warning), but technically unnecessary.
# Remove the line if you don't plan to reactivate the weather link.

alias: AQ Alle stoppen
sequence:
  - action: script.turn_off
    target:
      entity_id:
        - script.aq_sunrise
        - script.aq_sunset
        - script.aq_weather_link_update
        - script.aq_clouds_dynamic
        - script.aq_siesta
  - action: input_boolean.turn_off
    target:
      entity_id:
        - input_boolean.aq_sunrise_running
        - input_boolean.aq_sunset_running
description: ''
