# EXPERIMENTAL / NOT ACTIVELY USED
# Original idea: couple weather-dependent brightness to weather.*.
# Deemed not mature and not really useful by the author — intentionally
# kept here for reference, but not wired into configuration.yaml.

alias: AQ Wetterkopplung aktualisieren
mode: restart
sequence:
  - condition: state
    entity_id: input_boolean.aq_weather_link
    state: 'on'
  - variables:
      weather_state: '{{ states(''weather.tholey'') }}'
  - choose:
      - conditions:
          - condition: template
            value_template: '{{ weather_state == ''sunny'' }}'
        sequence:
          - target:
              entity_id: input_number.aq_cloud_intensity
            data:
              value: 10
            action: input_number.set_value
          - target:
              entity_id: input_number.aq_base_day_pct
            data:
              value: 90
            action: input_number.set_value
      - conditions:
          - condition: template
            value_template: '{{ weather_state == ''partlycloudy'' }}'
        sequence:
          - target:
              entity_id: input_number.aq_cloud_intensity
            data:
              value: 40
            action: input_number.set_value
          - target:
              entity_id: input_number.aq_base_day_pct
            data:
              value: 80
            action: input_number.set_value
      - conditions:
          - condition: template
            value_template: '{{ weather_state == ''cloudy'' }}'
        sequence:
          - target:
              entity_id: input_number.aq_cloud_intensity
            data:
              value: 60
            action: input_number.set_value
          - target:
              entity_id: input_number.aq_base_day_pct
            data:
              value: 70
            action: input_number.set_value
      - conditions:
          - condition: template
            value_template: '{{ weather_state == ''rainy'' }}'
        sequence:
          - target:
              entity_id: input_number.aq_cloud_intensity
            data:
              value: 80
            action: input_number.set_value
          - target:
              entity_id: input_number.aq_base_day_pct
            data:
              value: 60
            action: input_number.set_value
  - data:
      name: Aquarium
      message: Wetterkopplung aktualisiert ({{ weather_state }})
    action: logbook.log
