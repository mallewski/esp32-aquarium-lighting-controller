# Calls script.aq_siesta (see homeassistant/scripts/aq_siesta.yaml)
# instead of duplicating the logic here. Previously this automation
# contained a diverging inline copy — now consolidated into the script.

id: aq_start_siesta
alias: AQ – Siesta starten
trigger:
  - platform: time
    at: input_datetime.aq_siesta_start
condition:
  - condition: state
    entity_id: input_boolean.aq_siesta_enable
    state: 'on'
action:
  - action: script.turn_on
    target:
      entity_id: script.aq_siesta
