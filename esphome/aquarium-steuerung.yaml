esphome:
  name: aquarium-steuerung
  friendly_name: Aquarium Steuerung
  min_version: 2026.6.0
  #on_boot:
    ## Optionales Anti-Zucken: kurz nach dem Boot das Licht sicher ausfahren
    #priority: -20
    #then:
    #  - delay: 200ms
    #  - light.turn_off:
    #      id: sera_ch1
    #      transition_length: 0.5s
    #  - light.turn_off:
    #      id: sera_ch2
    #      transition_length: 0.5s

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    # version: 5.5.1
  watchdog_timeout: 10s

# Logs auf der seriellen Konsole
logger:

# Native API zu Home Assistant
api:
  encryption:
    key: !secret aquarium_steuerung__api_encryption_key

# OTA-Update
ota:
  - platform: esphome
    password: !secret aquarium_steuerung__ota_password

# WLAN
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  post_connect_roaming: false
  ap:
    ssid: "Dimmer Fallback Hotspot"
    password: !secret aquarium_steuerung__ap_password
  # NOTE: adjust to your own network, don't use these values as-is.
  manual_ip:
    static_ip: 192.168.2.5
    gateway: 192.168.2.1
    subnet: 255.255.255.0
    dns1: 192.168.2.1
    dns2: 8.8.8.8

captive_portal:

# (Optional) small test web interface
# SECURITY NOTE: without 'auth:' this interface is unprotected on the
# local network. For production use, add basic auth:
# web_server:
#   port: 80
#   auth:
#     username: !secret aquarium_steuerung__web_user
#     password: !secret aquarium_steuerung__web_password
web_server:
  port: 80

# ---------- PWM output & light entity (Variant A) ----------
# Wiring (see docs/pinout.md for the full table):
#   GPIO18 → 220 Ω → Gate IRLZ44N (channel 1)
#   GPIO19 → 220 Ω → Gate IRLZ44N (channel 2)
#   Gate → 10 kΩ → GND
#   Source → GND
#   Drain → LED- (L−)
#   +20 V → LED+ (L+)
#   TVS P6KE33A across the LED (K to L+, A to L−) — also add this part
#   to the README component list, currently only documented here.

output:
  # Roh-PWM-Ausgang
  - platform: ledc
    pin: GPIO18
    id: sera_led_pwm_1
    frequency: 1000 Hz
  - platform: ledc
    pin: GPIO19
    id: sera_led_pwm_2
    frequency: 1000 Hz

light:
  - platform: monochromatic
    name: "Sera Ch1"
    id: sera_ch1
    output: sera_led_pwm_1
    default_transition_length: 5s
    gamma_correct: 2.4       # Auflösung der Kurve im Anfangsbereich.
    restore_mode: RESTORE_DEFAULT_OFF  # nach Neustart bleibt das Licht aus
  - platform: monochromatic
    name: "Sera Ch2"
    id: sera_ch2
    output: sera_led_pwm_2
    default_transition_length: 5s
    gamma_correct: 2.4       # Auflösung der Kurve im Anfangsbereich.
    restore_mode: RESTORE_DEFAULT_OFF  # nach Neustart bleibt das Licht aus

# DS18B20 water temperature sensor.
# IMPORTANT: add a 4.7 kΩ pull-up resistor between the data pin (GPIO4)
# and 3.3V/VCC — the DS18B20 requires this, it was previously missing
# from the wiring documentation.
one_wire:
  - platform: gpio
    id: bus_a
    pin: GPIO4

sensor:
  - platform: dallas_temp
    one_wire_id: bus_a
    name: "Wassertemperatur"
    # 5s was unnecessarily aggressive for water temperature, which
    # doesn't change second-by-second. 30s saves WiFi/CPU load.
    update_interval: 30s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
  - platform: debug
    free:
      name: "ESP Heap Free"
  - platform: wifi_signal
    name: "WLAN Signalstärke"
    update_interval: 30s

debug:
text_sensor:
  - platform: debug
    reset_reason:
      name: "ESP Reset Reason"
